[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-spring"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2.3", "pyarrow", "PyYAML", "scipy"]

[project.optional-dependencies]
test = ["pytest"]
dashboard = ["streamlit>=1.51", "plotly>=5.24"]

[project.scripts]
gas-spring = "gas_spring.cli:main"

[tool.setuptools.packages.find]
include = ["gas_spring*"]
